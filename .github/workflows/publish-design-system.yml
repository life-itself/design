name: Publish SoR design system

# Builds projects/sor-design-system/site/ and commits it on top of the
# `design-system-site` branch. Flowershow is connected to that branch and syncs
# by commit, so each build is a normal commit with the previous build as parent
# (never a force-pushed fresh history, which Flowershow did not pick up).
on:
  push:
    branches: [main]
    paths:
      - "projects/sor-design-system/**"
      - ".github/workflows/publish-design-system.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-design-system
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ImageMagick (gallery thumbnails call `magick`)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick
          command -v magick || printf '#!/bin/sh\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null && sudo chmod +x /usr/local/bin/magick

      - name: Build site
        working-directory: projects/sor-design-system
        run: |
          python3 system/build/build-specimens.py
          python3 system/build/build-galleries.py
          python3 system/build/build-site.py

      - name: Commit site on top of the design-system-site branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          pub="$RUNNER_TEMP/pub"
          if git ls-remote --exit-code --heads "$REMOTE" design-system-site >/dev/null; then
            git clone -q --depth 1 --branch design-system-site "$REMOTE" "$pub"
          else
            git init -q -b design-system-site "$pub"
          fi
          rsync -a --delete --exclude .git projects/sor-design-system/site/ "$pub/"
          cd "$pub"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -q "$REMOTE" HEAD:design-system-site
