name: Publish SoR design system

# Builds projects/sor-design-system/site/ and force-pushes it as the root of the
# `design-system-site` branch. Flowershow is connected to that branch.
on:
  push:
    branches: [main]
    paths:
      - "projects/sor-design-system/**"
      - ".github/workflows/publish-design-system.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-design-system
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        working-directory: projects/sor-design-system
        run: |
          python3 system/build-specimens.py
          python3 system/build-site.py

      - name: Push site to design-system-site branch
        working-directory: projects/sor-design-system/site
        run: |
          git init -q -b design-system-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" design-system-site
