<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For All the Living Beings</title>
<style>
  @font-face {
    font-family: "Polyamine";
    src: local("Polyamine"), url("assets/fonts/Polyamine.ttf") format("truetype");
    font-display: swap;
  }
  body { margin: 0; }
  .x-arrival {
    --bg: oklch(1 0 0);
    --fg: oklch(0.14 0 0);
    --accent: oklch(0.68 0.19 48);
    --font-display: "Polyamine", "Cormorant Garamond", "Didot", "Bodoni 72", Georgia, serif;
    background: var(--bg); color: var(--fg);
  }
  .x-arrival, .x-arrival * { box-sizing: border-box; margin: 0; }
  .x-arrival { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 0 4vw; }
  .x-arrival canvas { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; display: block; pointer-events: none; }
  .x-arrival h1 {
    position: relative; z-index: 1;
    width: 100%;
    font-family: var(--font-display);
    font-weight: 400;
    text-transform: uppercase;
    text-align: center;
    font-size: 8vw;
    line-height: 1.1;
    letter-spacing: 0.02em;
    animation: x-arrival-rise 2.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .x-arrival h1 .ln { display: block; white-space: nowrap; }
  .x-arrival h1 em { font-style: normal; color: var(--accent); }
  @keyframes x-arrival-rise { from { opacity: 0; transform: translateY(16px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  /* small screens: let the statement wrap naturally instead of shrinking the desktop lines */
  .x-arrival h1 .mb { display: none; }
  @media (max-width: 720px) {
    .x-arrival h1 .ln { display: inline; }
    .x-arrival h1 .mb { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) { .x-arrival h1 { animation: none; } }
</style>
</head>
<body>
<main class="stage x-arrival">
  <canvas id="field" aria-hidden="true"></canvas>
  <h1 aria-label="For all the living beings whose heart burns to see a new world emerge">
    <span class="ln">For all the<br class="mb"> living beings</span>
    <span class="ln">whose<br class="mb"> <em>heart burns</em><br class="mb"> to see</span>
    <span class="ln">a<br class="mb"> new world<br class="mb"> emerge</span>
  </h1>
</main>

<script>
(() => {
  // Fit the longest line to ~94% of the viewport width (capped by height).
  const root = document.querySelector('.x-arrival');
  const h1 = root.querySelector('h1');
  const MOBILE = 720;
  function fit() {
    if (innerWidth <= MOBILE) {                    // seven short lines: fit the widest to the screen, then check height
      h1.style.fontSize = '100px';
      const rg = document.createRange(); rg.selectNodeContents(h1);
      const w = Math.max(...[...rg.getClientRects()].map(r => r.width));
      let fs = 100 * (innerWidth * 0.92) / w;
      h1.style.fontSize = fs + 'px';
      while (h1.getBoundingClientRect().height > innerHeight * 0.88 && fs > 14) { fs *= 0.96; h1.style.fontSize = fs + 'px'; }
      return;
    }
    h1.style.fontSize = '100px';                   // large screens: keep the three-line structure, fill the width
    const lines = [...h1.querySelectorAll('.ln')];
    const w = Math.max(...lines.map(l => l.getBoundingClientRect().width));
    const byW = 100 * (innerWidth * 0.94) / w;
    const byH = innerHeight * 0.9 / (lines.length * 1.1);
    h1.style.fontSize = Math.min(byW, byH) + 'px';
  }
  fit(); addEventListener('resize', fit);
  if (document.fonts) document.fonts.ready.then(fit);

  // Six seeds on a fixed choreography: clumped "full stop" -> burst up-left -> swirl -> each settles on a letter.
  const cv = root.querySelector('canvas');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ink = 'oklch(0.14 0 0)', paper = 'oklch(1 0 0)';
  const RELEASE = 3.2;                                   // seconds held as a full stop
  // per seed: burst angle/speed, settle start (s after release), swirl direction, radius, perch
  const PLAN = [
    { ang: 4.35, kick: 120, t0: 1.6, sw:  1, r: 7,   perch: { line: 0, i: 13, at: 'top' } },     // dot over the I of LIVING
    { ang: 3.40, kick:  95, t0: 2.6, sw: -1, r: 6.5, perch: { line: 1, i: 13, at: 'bottom' } },  // inside the bottom of the U of BURNS
    { ang: 4.00, kick: 110, t0: 3.6, sw:  1, r: 6,   perch: { line: 1, i: 6, at: 'crossbar' } },  // on the crossbar of the H of HEART
    { ang: 3.70, kick:  85, t0: 2.1, sw: -1, r: 7,   perch: { line: 2, i: 3,  at: 'midarm' } },  // on the middle arm of the E of NEW
    { ang: 4.60, kick: 130, t0: 4.3, sw:  1, r: 6.5, perch: { line: 2, i: 7,  at: 'bottom', mdx: 3 } },  // bottom of the O of WORLD
    { ang: 3.55, kick: 100, t0: 3.1, sw: -1, r: 6,   perch: { line: 0, i: 19, at: 'bowl', dx: -4.5, mdx: -3 } }      // resting in the bottom of the B of BEINGS
  ];
  let W, H, dpr, seeds = [], ground = 0, start = null;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // Ink-accurate glyph geometry: pen position from the DOM range, ink extents from canvas metrics.
  function glyph(line, i) {
    const ln = h1.querySelectorAll('.ln')[line];
    const tw = document.createTreeWalker(ln, NodeFilter.SHOW_TEXT);   // line 2 has text inside <em>
    let node = tw.nextNode();
    while (i >= node.length) { i -= node.length; node = tw.nextNode(); }
    const rg = document.createRange(); rg.setStart(node, i); rg.setEnd(node, i + 1);
    const rc = rg.getBoundingClientRect(), fs = parseFloat(h1.style.fontSize) || 80;
    ctx.font = fs + 'px Polyamine, serif';
    const m = ctx.measureText(node.textContent[i].toUpperCase());
    const asc = m.fontBoundingBoxAscent != null ? m.fontBoundingBoxAscent : rc.height * 0.8;
    const base = rc.top + asc;
    return { fs, base, right: rc.right, inkL: rc.left - m.actualBoundingBoxLeft, cx: rc.left + (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2,
             inkR: rc.left + m.actualBoundingBoxRight, top: base - m.actualBoundingBoxAscent,
             bottom: base + m.actualBoundingBoxDescent };
  }
  function layout() {
    const lns = h1.querySelectorAll('.ln'), last = lns[lns.length - 1];
    const fs = parseFloat(h1.style.fontSize) || 80;
    const g = glyph(lns.length - 1, last.textContent.length - 1);   // final letter, wherever it wraps
    ground = g.base;                                    // baseline of the last visual line is the floor
    const a = { x: Math.min(g.right + fs * 0.22, W - 14), y: ground };
    for (const p of seeds) {
      const t = p.plan.perch, q = glyph(t.line, t.i), r = p.r;
      p.a = a;
      if (t.at === 'top') p.tx = q.cx, p.ty = q.top - r - 1;
      else if (t.at === 'rightbar') p.tx = q.inkR - q.fs * 0.12 + 5, p.ty = q.top - r - 1;
      else if (t.at === 'midarm') p.tx = q.inkL + (q.inkR - q.inkL) * 0.62, p.ty = (q.top + q.bottom) / 2 - r;
      else if (t.at === 'crossbar') p.tx = q.cx, p.ty = (q.top + q.bottom) / 2 - r;
      else if (t.at === 'bowl') p.tx = q.inkL + (q.inkR - q.inkL) * 0.62, p.ty = q.bottom - q.fs * 0.035 - r;
      else p.tx = q.cx, p.ty = q.bottom - q.fs * 0.035 - r;
      p.tx += innerWidth <= MOBILE ? (t.mdx || 0) : (t.dx || 0);   // per-perch nudges (px), separate for phones
      p.tx = Math.min(Math.max(p.tx, r + 2), W - r - 2);
      p.ty = Math.min(p.ty, ground - r);
    }
  }
  function seed() {
    seeds = PLAN.map((plan, i) => {
      const o = 0.9 + i * 1.05, d = 1.5 + (i * 2.3) % 6.5;    // fixed jumble inside the clump
      const k = innerWidth <= MOBILE ? 0.82 : 1;                 // smaller seeds on phones
      return { plan, r: plan.r * k, hx: Math.cos(o) * d * k, hy: -Math.abs(Math.sin(o)) * d * k,
               x: 0, y: 0, vx: 0, vy: 0, went: false, done: false, ph: i * 1.7 };
    });
    layout();
    start = null;
  }
  function draw(p) {
    ctx.fillStyle = ink; ctx.strokeStyle = paper; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); ctx.stroke();
  }
  let last = 0, laidOut = false;
  function step(ms) {
    const dt = Math.min((ms - last) / 1000 || 0.016, 0.05); last = ms;
    if (start === null) { start = ms; laidOut = false; }
    const T = (ms - start) / 1000, R = T - RELEASE;
    ctx.clearRect(0, 0, W, H);
    if (R < 0) layout();                                // track the text while it fades in
    else if (!laidOut) { layout(); laidOut = true; }
    for (const p of seeds) {
      const pl = p.plan;
      if (R < 0 && !reduce) { p.x = p.a.x + p.hx; p.y = p.a.y - p.r + p.hy; draw(p); continue; }
      if (reduce) { p.x = p.tx; p.y = p.ty; draw(p); continue; }
      if (p.done) { draw(p); continue; }
      if (!p.went) { p.went = true; p.vx = Math.cos(pl.ang) * pl.kick; p.vy = Math.sin(pl.ang) * pl.kick; }
      const s = R - pl.t0;
      if (s < 0) {                                      // burst, then drift on a gentle curl
        p.vx += Math.sin(T * 0.9 + p.ph) * 70 * dt; p.vy += Math.cos(T * 0.7 + p.ph) * 55 * dt;
        const k = Math.exp(-0.9 * dt); p.vx *= k; p.vy *= k;
      } else {                                          // spiral in: damped spring + decaying swirl
        const w = 1.2 * Math.min(1, s / 1.5), z = 0.8;
        const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy) + 0.001;
        const sw = pl.sw * 240 * Math.exp(-s / 2.2) * Math.min(1, d / 140);
        p.vx += (w * w * dx - 2 * z * w * p.vx - dy / d * sw) * dt;
        p.vy += (w * w * dy - 2 * z * w * p.vy + dx / d * sw) * dt;
        if (s > 2 && d < 1.2 && Math.hypot(p.vx, p.vy) < 4) { p.x = p.tx; p.y = p.ty; p.done = true; draw(p); continue; }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > ground - p.r) { p.y = ground - p.r; p.vy = Math.min(p.vy, 0); }   // the last line is the ground
      if (p.y < p.r + 2) { p.y = p.r + 2; p.vy = Math.max(p.vy, 0); }
      if (p.x < p.r + 2) { p.x = p.r + 2; p.vx = Math.max(p.vx, 0); }
      if (p.x > W - p.r - 2) { p.x = W - p.r - 2; p.vx = Math.min(p.vx, 0); }
      draw(p);
    }
    if (!reduce) requestAnimationFrame(step);
  }
  addEventListener('resize', () => { resize(); seed(); if (reduce) requestAnimationFrame(step); });
  if (document.fonts) document.fonts.ready.then(() => { fit(); layout(); });
  resize(); seed(); requestAnimationFrame(step);
})();
</script>
</body>
</html>
